<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf3f5"><title>Weather outlook</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17343d;background:#eaf3f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 84% 12%,#cce8e8 0,transparent 32%),#eaf3f5}.shell{max-width:980px;margin:auto;padding:64px 24px}.eyebrow{color:#137c78;text-transform:uppercase;letter-spacing:.14em;font-size:.76rem;font-weight:750}h1{font-size:clamp(2.4rem,6vw,4.3rem);letter-spacing:-.055em;line-height:1.05;margin:14px 0}.intro{max-width:580px;color:#587077;line-height:1.65}.panel{background:#fff;border:1px solid #dbe8e8;border-radius:20px;padding:24px;margin-top:34px;box-shadow:0 14px 40px #17343d0d}.controls{display:flex;align-items:end;gap:14px;flex-wrap:wrap}label{display:block;font-size:.86rem;font-weight:650;color:#3b5961}.city{display:grid;gap:8px;flex:1;min-width:220px}input[type=text]{font:inherit;border:1px solid #cbdadb;border-radius:10px;padding:12px 13px;color:#17343d;outline-color:#138b84}.toggle{display:flex;gap:9px;align-items:center;padding:12px 0;color:#426168}button{border:0;border-radius:10px;padding:13px 20px;background:#087f78;color:white;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#056a65}#status{color:#a1412b;margin:16px 0 0}.source{color:#6e858a;font-size:.88rem}table{width:100%;border-collapse:collapse;margin-top:18px;text-align:left}th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:#688087}td,th{padding:14px 10px;border-bottom:1px solid #e5eeee}td:nth-child(4){color:#086d67;font-weight:600}footer{margin-top:25px;color:#6d8287;font-size:.86rem}a{color:#087f78}@media(max-width:650px){.shell{padding:40px 16px}.panel{padding:18px;overflow:auto}table{min-width:650px}button{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">Three-day city forecast</div>
    <h1>Plan for the<br>weather ahead.</h1>
    <p class="intro">See daily highs, lows, forecast windows, and practical alerts for rain, heat, strong winds, and thunderstorms.</p>
    <section class="panel" aria-label="Weather search">
      <form id="weather-form" class="controls">
        <div class="city"><label for="city">City</label><input id="city" name="city" type="text" value="London" maxlength="100" required autocomplete="address-level2"></div>
        <label class="toggle"><input id="offline" type="checkbox"> Use offline sample</label>
        <button type="submit">Get forecast</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="result"></div>
    </section>
    <footer>OpenAPI documentation: <a href="/swagger-ui/index.html">Swagger UI</a></footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
