<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eff6ff">
  <title>Weather Forecast</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #eff6ff;
      color: #172554;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 8px;
      color: #1d4ed8;
    }

    .intro {
      color: #475569;
      line-height: 1.5;
    }

    .panel {
      margin-top: 28px;
      padding: 24px;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 4px 14px #1e3a8a12;
    }

    .controls {
      display: flex;
      align-items: end;
      gap: 16px;
      flex-wrap: wrap;
    }

    .city-field {
      display: grid;
      flex: 1;
      min-width: 200px;
      gap: 8px;
    }

    label {
      color: #1e3a8a;
      font-weight: bold;
    }

    input[type="text"] {
      padding: 11px;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      font: inherit;
    }

    input[type="text"]:focus {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }

    .offline-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 0;
      font-weight: normal;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: #ffffff;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #status {
      color: #1e40af;
    }

    .source,
    footer {
      color: #64748b;
    }

    table {
      width: 100%;
      margin-top: 18px;
      border-collapse: collapse;
      text-align: left;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #dbeafe;
    }

    th {
      background: #eff6ff;
      color: #1e3a8a;
    }

    footer {
      margin-top: 24px;
      font-size: 14px;
    }

    a {
      color: #1d4ed8;
    }

    @media (max-width: 650px) {
      .panel {
        overflow-x: auto;
      }

      table {
        min-width: 620px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Three-Day Weather Forecast</h1>
    <p class="intro">
      Enter a city to see its daily high and low temperatures, forecast times, and weather advice.
      You can use the offline sample if live weather is unavailable.
    </p>

    <section class="panel" aria-label="Weather search">
      <form id="weather-form" class="controls">
        <div class="city-field">
          <label for="city">City name</label>
          <input id="city" name="city" type="text" value="London" maxlength="100" required>
        </div>

        <label class="offline-option" for="offline">
          <input id="offline" type="checkbox">
          Use offline sample
        </label>

        <button type="submit">Get forecast</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
      <div id="result"></div>
    </section>

    <footer>
      API documentation: <a href="/swagger-ui/index.html">Open Swagger UI</a>
    </footer>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
